# =====================================================================
# Fly-Flappy: Biological Connectome RL Configuration
# ---------------------------------------------------------------------
# All knobs for local smoke-tests and full GPU-server runs live here.
# Two profiles: `smoke` (CPU laptop) and `full` (GPU server).
# =====================================================================

profile: smoke   # one of: smoke | full

# --------------------------- Connectome ------------------------------
connectome:
  # Directory for pre-processed connectome caches (.npz). Cache filename
  # is derived as "{profile}_{source}.npz" so smoke/full and
  # synthetic/flywire never collide or silently load the wrong graph.
  cache_dir: data/connectome
  raw_dir: data/connectome/raw

  # Source dataset per profile. `synthetic` produces a random-but-structured
  # graph so laptops without the FlyWire download can still run end-to-end.
  # `flywire` loads the real MCNS/Codex export from `raw_dir`.
  sources:
    smoke: synthetic
    full: flywire

  # Neuron / synapse budget per profile. `full` = the real MCNS v1.0 neuron
  # count (166,700, ~6.2M synapses after coalescing). Training the full graph
  # with learnable synapses is only feasible thanks to the custom sparse
  # backward in sparse_ops.py (the builtin would need a 111 GB dense n^2
  # gradient). It REQUIRES a GPU — on CPU a single fwd+bwd is ~107s. Calibrate
  # wall-clock on your GPU box (short run) before committing to a long rental;
  # if per-step time is too high, subsample by lowering `neurons` here (snowball
  # sampling keeps local density realistic — e.g. 30000 gives ~40 syn/neuron).
  # synapses_per_neuron only affects the `synthetic` builder; real-data loads
  # use however many synapses the connections table actually has.
  budgets:
    smoke:
      neurons: 2048
      synapses_per_neuron: 32
    full:
      neurons: 20000
      synapses_per_neuron: 120

  # Fraction of neurons wired as sensory (afferent) and motor (efferent).
  sensory_fraction: 0.05
  motor_fraction:   0.02

  # Random seed for graph construction (synthetic + subsampling).
  seed: 1337

# ----------------------------- Model ---------------------------------
model:
  # Simulation steps of the recurrent spiking-esque connectome per env step.
  sim_steps: 4
  # Leak factor of the membrane potential (0 = perfect integrator, 1 = memoryless).
  leak: 0.15
  # Nonlinearity applied to per-neuron activations: tanh | relu | sigmoid.
  activation: tanh
  # If true, synapse weights are learnable. If false, only readout learns.
  train_synapses: true

# ---------------------------- Environment ----------------------------
env:
  id: FlappyBird-v0
  # `simple` uses the 12-dim state vector; `pixels` uses RGB frames.
  observation_mode: simple
  # Parallel envs. Local CPU: 1-2. GPU box: 16+.
  n_envs:
    smoke: 1
    full:  16

# ---------------------------- Training -------------------------------
training:
  algorithm: PPO
  total_timesteps:
    smoke: 5000
    full:  5000000
  learning_rate: 3.0e-4
  n_steps: 512
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.01
  checkpoint_dir: runs/checkpoints
  tensorboard_dir: runs/tb

# --------------------------- Telemetry -------------------------------
telemetry:
  enabled: true
  video_dir: runs/videos
  fps: 30
  panel_height: 512
  panel_width:  512
  # Every N env steps, write a frame to the mp4 (1 = every step). Bump this
  # to 200-1000+ for `full` runs — writing every step of a 5M-step run
  # would produce an unusably long video.
  frame_stride: 1
  # Max neurons rendered in the live 3D brain point-cloud. Subsampled once
  # (fixed random subset) if the connectome has more than this — rendering
  # is vectorised so this is a size/clarity knob, not really a perf one.
  heatmap_neurons: 20000
  # Radians per frame the brain camera auto-rotates.
  brain_rotate_speed: 0.02

# ----------------------------- Device --------------------------------
device: auto   # auto | cpu | cuda | cuda:0
